server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Blazor WebAssembly needs correct MIME types and SPA fallback routing.
    types {
        application/wasm wasm;
        application/octet-stream dll dat blat;
        application/json json;
        text/css css;
        application/javascript js mjs;
        image/png png;
    }
    gzip on;
    gzip_types application/wasm application/octet-stream application/javascript text/css application/json;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
