server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # NOTE: do not declare a `types { }` block here – it would REPLACE nginx's
    # inherited mime.types table rather than extend it, and index.html would be
    # served as application/octet-stream (the browser downloads it instead of
    # rendering it). The stock image already maps .html, .css, .js, .json, .png
    # and .wasm correctly; .dll/.dat/.pdb fall back to application/octet-stream,
    # which is what Blazor expects.
    default_type application/octet-stream;

    gzip on;
    gzip_types text/html text/css application/javascript application/json application/wasm application/octet-stream;

    # Blazor WebAssembly is a SPA: unknown paths must fall back to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # The WASM runtime and assets are fingerprinted, so they can be cached hard.
    location /_framework/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # The client reads its API base URL from this file at start-up – never cache it.
    location = /appsettings.json {
        add_header Cache-Control "no-store";
    }
}
